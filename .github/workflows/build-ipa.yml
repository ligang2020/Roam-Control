name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/RoamControl.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=26.2

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RoamControl.xcarchive/Products/Applications/RoamControl.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry RoamControl.ipa Payload
          echo "path=$RUNNER_TEMP/RoamControl.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoamControl-ipa
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Upload tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.path }}
